<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite cacche</title>
<style>
  body { margin:0; padding:24px 16px; background:#fff4ec; font-family:system-ui,sans-serif; color:#5e3a1f; }
  h1 { text-align:center; font-size:22px; margin:0 0 20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; max-width:720px; margin:0 auto; }
  .card { background:#fff; border-radius:22px; padding:14px 8px 12px; text-align:center; box-shadow:0 3px 0 #f0d9c8; }
  .card img { width:100px; height:100px; }
  .card span { display:block; font-weight:700; margin-top:4px; }
  .card small { color:#a08e80; }
</style>
</head>
<body>
<h1>Sprite cacche</h1>
<div class="grid">
  <div class="card"><img src="sprites/regolare.svg"><span>Regolare</span><small>liscia, a salsiccia</small></div>
  <div class="card"><img src="sprites/dura.svg"><span>Dura</span><small>a palline</small></div>
  <div class="card"><img src="sprites/grumosa.svg"><span>Grumosa</span><small>con crepe</small></div>
  <div class="card"><img src="sprites/morbida.svg"><span>Morbida</span><small>molle</small></div>
  <div class="card"><img src="sprites/liquida.svg"><span>Liquida</span><small>diarrea</small></div>
  <div class="card"><img src="sprites/tanta.svg"><span>Tanta</span><small>abbondante</small></div>
  <div class="card"><img src="sprites/poca.svg"><span>Poca</span><small>pochina</small></div>
  <div class="card"><img src="sprites/niente.svg"><span>Niente</span><small>giorno saltato</small></div>
</div>
</body>
</html>
